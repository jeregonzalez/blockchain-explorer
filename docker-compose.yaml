version: '3.5'

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    entrypoint: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DEBUG=True
      - ETHERSCAN_API_KEY=IJ9W4XUNK1WE7VPPK3G1CES4AD8IRE6BKU

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    entrypoint: npm start
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8000/api/v1
